<div class="fixed inset-0 bg-slate-900/30 backdrop-blur-sm z-40 transition-opacity duration-300"></div>

<div class="fixed inset-y-0 right-0 z-50 w-full max-w-4xl bg-white shadow-2xl flex flex-col transform transition-transform duration-300 ease-in-out">
  
  <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
    <h3 class="text-base font-bold text-slate-800 tracking-tight">Edit Content Payload</h3>
    <button type="button" class="p-1.5 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <form class="flex-1 overflow-y-auto p-5 space-y-4 text-xs select-none [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">
    <h5>This is Question Edit Desing component</h5>
    <div class="bg-slate-50/70 p-3.5 rounded-xl border border-slate-100/80 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3 items-end">
      
      <div class="space-y-1">
        <label class="font-bold text-slate-600">Serial Number</label>
        <input type="text" placeholder="e.g. 01" class="w-full px-2.5 py-1.5 bg-white border border-slate-200 rounded-md text-slate-800 focus:outline-none focus:border-orange-500" />
      </div>

      <div class="space-y-1">
        <label class="font-bold text-slate-600">Language</label>
        <select class="w-full px-2.5 py-1.5 bg-white border border-slate-200 rounded-md text-slate-700 focus:outline-none focus:border-orange-500">
          <option>Angular</option>
          <option>TypeScript</option>
        </select>
      </div>

      <div class="space-y-1">
        <label class="font-bold text-slate-600">Label</label>
        <select class="w-full px-2.5 py-1.5 bg-white border border-slate-200 rounded-md text-slate-700 focus:outline-none focus:border-orange-500">
          <option>Beginner</option>
          <option>Advanced</option>
        </select>
      </div>

      <div class="space-y-1">
        <label class="font-bold text-slate-600">Topic Area</label>
        <select class="w-full px-2.5 py-1.5 bg-white border border-slate-200 rounded-md text-slate-700 focus:outline-none focus:border-orange-500">
          <option>fundamentals</option>
          <option>lifecycle</option>
        </select>
      </div>

      <div class="space-y-1">
        <label class="font-bold text-slate-600">Status</label>
        <select class="w-full px-2.5 py-1.5 bg-white border border-slate-200 rounded-md text-slate-700 focus:outline-none focus:border-orange-500">
          <option>Pending</option>
          <option>Completed</option>
        </select>
      </div>

      <div class="flex items-center justify-start h-8 pl-2">
        <label class="flex items-center gap-2 font-bold text-slate-600 cursor-pointer">
          <input type="checkbox" class="w-4 h-4 rounded text-orange-500 focus:ring-orange-500 border-slate-300 transition-colors cursor-pointer" />
          <span>Visible UI</span>
        </label>
      </div>

    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
      <div class="space-y-1">
        <label class="font-bold text-slate-600">Primary Question Focus</label>
        <textarea rows="3" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-slate-800 focus:outline-none focus:border-orange-500 font-medium leading-relaxed resize-none"></textarea>
      </div>
      <div class="space-y-1">
        <label class="font-bold text-slate-600">Resolution Answer Plain text</label>
        <textarea rows="3" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-slate-800 focus:outline-none focus:border-orange-500 leading-relaxed resize-none"></textarea>
      </div>
      <div class="space-y-1">
        <label class="font-bold text-slate-600">Alternative Context Answer (2)</label>
        <textarea rows="3" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-slate-800 focus:outline-none focus:border-orange-500 leading-relaxed resize-none"></textarea>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
      
      <div class="bg-slate-50 p-3 rounded-xl border border-slate-200/60 space-y-2">
        <div class="flex items-center justify-between gap-1.5">
          <input type="text" placeholder="Code Block Title 1" class="w-full px-2 py-1 bg-white border border-slate-200 rounded font-semibold text-slate-700 focus:outline-none focus:border-orange-500" />
          <select class="w-20 px-1 py-1 bg-white border border-slate-200 rounded text-[11px] text-slate-500 focus:outline-none">
            <option>TypeScript</option>
            <option>HTML</option>
          </select>
        </div>
        <textarea rows="4" placeholder="// Content block segment..." class="w-full p-2 bg-white border border-slate-200 rounded-lg font-mono text-[11px] leading-normal text-slate-800 focus:outline-none focus:border-orange-500 resize-none"></textarea>
      </div>

      <div class="bg-slate-50 p-3 rounded-xl border border-slate-200/60 space-y-2">
        <div class="flex items-center justify-between gap-1.5">
          <input type="text" placeholder="Code Block Title 2" class="w-full px-2 py-1 bg-white border border-slate-200 rounded font-semibold text-slate-700 focus:outline-none focus:border-orange-500" />
          <select class="w-20 px-1 py-1 bg-white border border-slate-200 rounded text-[11px] text-slate-500 focus:outline-none">
            <option>TypeScript</option>
            <option>HTML</option>
          </select>
        </div>
        <textarea rows="4" placeholder="// Content block segment..." class="w-full p-2 bg-white border border-slate-200 rounded-lg font-mono text-[11px] leading-normal text-slate-800 focus:outline-none focus:border-orange-500 resize-none"></textarea>
      </div>

      <div class="bg-slate-50 p-3 rounded-xl border border-slate-200/60 space-y-2">
        <div class="flex items-center justify-between gap-1.5">
          <input type="text" placeholder="Code Block Title 3" class="w-full px-2 py-1 bg-white border border-slate-200 rounded font-semibold text-slate-700 focus:outline-none focus:border-orange-500" />
          <select class="w-20 px-1 py-1 bg-white border border-slate-200 rounded text-[11px] text-slate-500 focus:outline-none">
            <option>TypeScript</option>
            <option>HTML</option>
          </select>
        </div>
        <textarea rows="4" placeholder="// Content block segment..." class="w-full p-2 bg-white border border-slate-200 rounded-lg font-mono text-[11px] leading-normal text-slate-800 focus:outline-none focus:border-orange-500 resize-none"></textarea>
      </div>

    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
      <div class="space-y-1">
        <label class="font-bold text-slate-600">Explanatory Answer Extension (3)</label>
        <textarea rows="2" class="w-full px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-slate-800 focus:outline-none focus:border-orange-500 leading-relaxed resize-none"></textarea>
      </div>
      <div class="space-y-1">
        <label class="font-bold text-slate-600">Explanatory Answer Extension (4)</label>
        <textarea rows="2" class="w-full px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-slate-800 focus:outline-none focus:border-orange-500 leading-relaxed resize-none"></textarea>
      </div>
    </div>

  </form>

  <div class="px-6 py-3.5 border-t border-slate-100 bg-slate-50 flex items-center justify-end gap-2.5">
    <button type="button" class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">
      Cancel
    </button>
    <button type="submit" class="px-5 py-2 text-xs font-semibold text-white bg-orange-500 hover:bg-orange-600 active:bg-orange-700 rounded-lg shadow-sm transition-colors">
      Save Changes
    </button>
  </div>
</div>
