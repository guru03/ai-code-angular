            <h4>This is copy from the edit2 component, I am modifying this component</h4>
            <div>
                <h3 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-4">1. Metadata &
                    Configuration</h3>

            <!-- <hr class="border-slate-200"> -->

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="space-y-1.5">
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide">Difficulty111</label>
                    <select
                        class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-700 focus:outline-none focus:border-orange-500 focus:bg-white transition-colors">
                        <option selected>Beginner</option>
                        <option>Intermediate</option>
                        <option>Advanced</option>
                    </select>
                </div>

                <div class="space-y-1.5">
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide">Read Time
                        (mins)</label>
                    <input type="number" value="5"
                        class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-700 focus:outline-none focus:border-orange-500 focus:bg-white transition-colors" />
                </div>

                <div class="space-y-1.5">
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide">Status</label>
                    <select
                        class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-700 focus:outline-none focus:border-orange-500 focus:bg-white transition-colors">
                        <option>Draft</option>
                        <option selected>Completed</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="space-y-1.5">
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide">Difficulty111</label>
                    <select
                        class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-700 focus:outline-none focus:border-orange-500 focus:bg-white transition-colors">
                        <option selected>Beginner</option>
                        <option>Intermediate</option>
                        <option>Advanced</option>
                    </select>
                </div>

                <div class="space-y-1.5">
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide">Read Time
                        (mins)</label>
                    <input type="number" value="5"
                        class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-700 focus:outline-none focus:border-orange-500 focus:bg-white transition-colors" />
                </div>

                <div class="space-y-1.5">
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide">Status</label>
                    <select
                        class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-700 focus:outline-none focus:border-orange-500 focus:bg-white transition-colors">
                        <option>Draft</option>
                        <option selected>Completed</option>
                    </select>
                </div>
            </div>

            <hr class="border-slate-200">

            <div class="space-y-5">
                <h3 class="text-sm font-semibold uppercase tracking-wider text-slate-400">2. Core Question & Answers
                </h3>

                <div class="space-y-1.5">
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide">Question Title</label>
                    <input type="text" value="What are lifecycle hooks in Angular?"
                        class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm font-medium text-slate-800 focus:outline-none focus:border-orange-500 focus:bg-white transition-colors" />
                </div>

                <div class="space-y-1.5">
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide">Answer</label>
                    <textarea rows="3"
                        class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-700 focus:outline-none focus:border-orange-500 focus:bg-white transition-colors resize-none">Every component in Angular has a lifecycle, and different phases it goes through from the time of creation to the time it's destroyed...</textarea>
                </div>

                <div class="space-y-1.5">
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide">Additional
                        Explanation</label>
                    <textarea rows="3"
                        class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-700 focus:outline-none focus:border-orange-500 focus:bg-white transition-colors">Every component in Angular has a lifecycle, and different phases it goes through from the time of creation to the time it's destroyed...</textarea>
                </div>
                
            </div>

            <hr class="border-slate-200">

            <div class="space-y-6">
                <h3 class="text-sm font-semibold uppercase tracking-wider text-slate-400">3. Code Blocks</h3>

                <div class="p-4 bg-slate-50 border border-slate-200 rounded-xl space-y-4">
                    <div class="flex items-center justify-between border-b border-slate-200 pb-2">
                        <span class="text-xs font-bold text-slate-500 uppercase">Snippet Block #1</span>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">Language</label>
                            <select formControlName="codeLanguage1"
                                class="w-full px-3 py-1.5 border border-slate-300 rounded-lg bg-white text-xs">
                                <option value="Typescript">TypeScript</option>
                                <option value="HTML">HTML</option>
                                <option value="CSS">CSS</option>
                            </select>
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-xs font-medium text-slate-600 mb-1">Title / Caption</label>
                            <input type="text" formControlName="codeTitle1"
                                class="w-full px-3 py-1.5 border border-slate-300 rounded-lg text-xs">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-00 mb-1">Code Editor Content</label>
                        <textarea formControlName="codeEditor1" rows="4"
                            class="w-full px-3 py-2 font-mono text-xs bg-slate-800 text-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500"></textarea>
                    </div>
                </div>
            </div>

            

            <div class="flex justify-end pt-4">
                <button type="submit"
                    class="px-6 py-2.5 bg-orange-500 hover:bg-orange-600 active:bg-orange-700 text-white font-medium text-sm rounded-lg shadow-sm shadow-orange-500/20 transition-all cursor-pointer">
                    Post Question Entry
                </button>
            </div>

        </form>
    </div>
</div>
