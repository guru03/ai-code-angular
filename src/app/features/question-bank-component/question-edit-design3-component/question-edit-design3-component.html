<div class="max-w-2xl mx-auto bg-white shadow-lg rounded-xl border border-gray-100 overflow-hidden">
  <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
    <h2 class="text-xl font-semibold text-gray-800">Edit Question Details</h2>
    <button class="text-gray-400 hover:text-gray-600 transition-colors">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
  </div>

  <form [formGroup]="questionForm" (ngSubmit)="onSubmit()" class="p-6 space-y-8">
    
    <div>
      <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-4">1. Metadata & Configuration</h3>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Serial Number</label>
          <input type="text" formControlName="serialNumber" 
                 class="w-full px-3 py-2 border rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
                 [ngClass]="{'border-red-500 focus:border-red-500 focus:ring-red-500/20': isInvalid('serialNumber'), 'border-gray-300 focus:border-indigo-500': !isInvalid('serialNumber')}">
          @if (isInvalid('serialNumber')) {
            <p class="text-xs text-red-500 mt-1">Serial number is required.</p>
          }
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Language</label>
          <select formControlName="language" 
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-white shadow-sm focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20">
            <option value="Angular">Angular</option>
            <option value="JavaScript">JavaScript</option>
            <option value="TypeScript">TypeScript</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Topic</label>
          <select formControlName="topic" 
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-white shadow-sm focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20">
            <option value="Angular Fundamentals">Angular Fundamentals</option>
            <option value="RxJS">RxJS</option>
            <option value="Signals">Signals</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Label</label>
          <input type="text" formControlName="label" 
                 class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Content Status</label>
          <input type="text" formControlName="contentStatus" 
                 class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-gray-50 text-gray-500 cursor-not-allowed shadow-sm" readonly>
        </div>

        <div class="flex items-center mt-6">
          <input id="isVisible" type="checkbox" formControlName="isVisible" 
                 class="h-4 w-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500 transition-colors">
          <label for="isVisible" class="ml-2 block text-sm font-medium text-gray-700 select-none">Make field visible on site</label>
        </div>

      </div>
    </div>

    <hr class="border-gray-100">

    <div class="space-y-4">
      <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">2. Core Question & Answers</h3>
      
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Question</label>
        <textarea formControlName="question" rows="3"
                  class="w-full px-3 py-2 border rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
                  [ngClass]="{'border-red-500 focus:border-red-500 focus:ring-red-500/20': isInvalid('question'), 'border-gray-300 focus:border-indigo-500': !isInvalid('question')}"></textarea>
        @if (isInvalid('question')) {
          <p class="text-xs text-red-500 mt-1">Please enter a valid question details.</p>
        }
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Answer</label>
        <textarea formControlName="answer" rows="4"
                  class="w-full px-3 py-2 border rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
                  [ngClass]="{'border-red-500 focus:border-red-500 focus:ring-red-500/20': isInvalid('answer'), 'border-gray-300 focus:border-indigo-500': !isInvalid('answer')}"></textarea>
        @if (isInvalid('answer')) {
          <p class="text-xs text-red-500 mt-1">An answer payload is required.</p>
        }
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Additional Explanation <span class="text-xs text-gray-400">(Optional)</span></label>
        <textarea formControlName="additionalExplanation" rows="3"
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20"></textarea>
      </div>
    </div>

    <div class="flex justify-end space-x-3 pt-4 border-t border-gray-100">
      <button type="button" class="px-4 py-2 border border-gray-300 text-sm font-medium rounded-lg text-gray-700 bg-white hover:bg-gray-50 transition-colors">Cancel</button>
      <button type="submit" [disabled]="questionForm.invalid"
              class="px-5 py-2 text-sm font-medium rounded-lg text-white transition-colors shadow-sm"
              [ngClass]="questionForm.invalid ? 'bg-orange-400 cursor-not-allowed opacity-70' : 'bg-orange-500 hover:bg-orange-600'">
        Save Changes
      </button>
    </div>

  </form>
</div>
