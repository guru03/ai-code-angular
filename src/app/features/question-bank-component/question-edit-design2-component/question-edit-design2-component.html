<div class="min-h-screen bg-slate-50 py-10 px-4 sm:px-6 lg:px-8">
    <div class="max-w-4xl mx-auto bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">

        <div class="bg-slate-900 px-6 py-5 sm:px-8">
            <h2 class="text-xl font-bold text-white">Create Question Entry</h2>
            <p class="text-xs text-slate-400 mt-1">Fill out the question details, answers, and accompanying code
                snippets.</p>
        </div>

        <form [formGroup]="questionForm" (ngSubmit)="onSubmit()" class="p-6 sm:p-8 space-y-8">

            <div>
                <h3 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-4">1. Metadata &
                    Configuration</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Serial Number</label>
                        <input type="text" formControlName="serialNumber"
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500 transition-all text-sm"
                            placeholder="e.g., SIG-18">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Language</label>
                        <select formControlName="language"
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm bg-white focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500 transition-all text-sm">
                            <option value="Angular">Angular</option>
                            <option value="Javascript">Javascript</option>
                            <option value="RxJS">RxJS</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Label</label>
                        <select formControlName="label"
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm bg-white focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500 transition-all text-sm">
                            <option value="Beginner">Beginner</option>
                            <option value="Intermediate">Intermediate</option>
                            <option value="Expert">Expert</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Topic</label>
                        <select formControlName="topic"
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm bg-white focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500 transition-all text-sm">
                            <option value="angular_fundamentals">Angular Fundamentals</option>
                            <option value="signals">Signals</option>
                            <option value="ngrx">NgRx</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Content Status</label>
                        <select formControlName="contentStatus"
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm bg-white focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500 transition-all text-sm">
                            <option value="Pending">Pending</option>
                            <option value="Published">Published</option>
                        </select>
                    </div>

                    <div class="flex items-center pt-6">
                        <label class="relative flex items-center cursor-pointer select-none">
                            <input type="checkbox" formControlName="visible"
                                class="w-4 h-4 text-orange-600 border-slate-300 rounded focus:ring-orange-500">
                            <span class="ml-2 text-sm font-medium text-slate-700">Make field visible on site</span>
                        </label>
                    </div>

                </div>
            </div>

            <hr class="border-slate-200">

            <div class="space-y-5">
                <h3 class="text-sm font-semibold uppercase tracking-wider text-slate-400">2. Core Question & Answers
                </h3>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Question</label>
                    <textarea formControlName="question" rows="3"
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500 text-sm"
                        placeholder="What are the benefits of using..."></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Answer 1 (Primary)</label>
                        <textarea formControlName="answer1" rows="3"
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500 text-sm"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Answer 2</label>
                        <textarea formControlName="answer2" rows="3"
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500 text-sm"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Answer 3</label>
                        <textarea formControlName="answer3" rows="3"
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500 text-sm"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Answer 4</label>
                        <textarea formControlName="answer4" rows="3"
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500 text-sm"></textarea>
                    </div>
                </div>
            </div>

            <hr class="border-slate-200">

            <div class="space-y-6">
                <h3 class="text-sm font-semibold uppercase tracking-wider text-slate-400">3. Code Blocks</h3>

                <div class="p-4 bg-slate-50 border border-slate-200 rounded-xl space-y-4">
                    <div class="flex items-center justify-between border-b border-slate-200 pb-2">
                        <span class="text-xs font-bold text-slate-500 uppercase">Snippet Block #1</span>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">Language</label>
                            <select formControlName="codeLanguage1"
                                class="w-full px-3 py-1.5 border border-slate-300 rounded-lg bg-white text-xs">
                                <option value="Typescript">TypeScript</option>
                                <option value="HTML">HTML</option>
                                <option value="CSS">CSS</option>
                            </select>
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-xs font-medium text-slate-600 mb-1">Title / Caption</label>
                            <input type="text" formControlName="codeTitle1"
                                class="w-full px-3 py-1.5 border border-slate-300 rounded-lg text-xs">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Code Editor Content</label>
                        <textarea formControlName="codeEditor1" rows="4"
                            class="w-full px-3 py-2 font-mono text-xs bg-slate-900 text-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500"></textarea>
                    </div>
                </div>

                <div class="p-4 bg-slate-50 border border-slate-200 rounded-xl space-y-4">
                    <div class="flex items-center justify-between border-b border-slate-200 pb-2">
                        <span class="text-xs font-bold text-slate-500 uppercase">Snippet Block #2</span>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">Language</label>
                            <select formControlName="codeLanguage2"
                                class="w-full px-3 py-1.5 border border-slate-300 rounded-lg bg-white text-xs">
                                <option value="Typescript">TypeScript</option>
                                <option value="HTML">HTML</option>
                                <option value="CSS">CSS</option>
                            </select>
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-xs font-medium text-slate-600 mb-1">Title / Caption</label>
                            <input type="text" formControlName="codeTitle2"
                                class="w-full px-3 py-1.5 border border-slate-300 rounded-lg text-xs">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Code Editor Content</label>
                        <textarea formControlName="codeEditor2" rows="4"
                            class="w-full px-3 py-2 font-mono text-xs bg-slate-900 text-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500"></textarea>
                    </div>
                </div>

                <div class="p-4 bg-slate-50 border border-slate-200 rounded-xl space-y-4">
                    <div class="flex items-center justify-between border-b border-slate-200 pb-2">
                        <span class="text-xs font-bold text-slate-500 uppercase">Snippet Block #3</span>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">Language</label>
                            <select formControlName="codeLanguage3"
                                class="w-full px-3 py-1.5 border border-slate-300 rounded-lg bg-white text-xs">
                                <option value="Typescript">TypeScript</option>
                                <option value="HTML">HTML</option>
                                <option value="CSS">CSS</option>
                            </select>
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-xs font-medium text-slate-600 mb-1">Title / Caption</label>
                            <input type="text" formControlName="codeTitle3"
                                class="w-full px-3 py-1.5 border border-slate-300 rounded-lg text-xs">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Code Editor Content</label>
                        <textarea formControlName="codeEditor3" rows="4"
                            class="w-full px-3 py-2 font-mono text-xs bg-slate-900 text-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500"></textarea>
                    </div>
                </div>
            </div>

            <hr class="border-slate-200">

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Angular Questions Related Linked Data (JSON
                    or reference IDs)</label>
                <textarea formControlName="angularQuestions" rows="2"
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm font-mono text-xs text-slate-600"></textarea>
            </div>

            <div class="flex justify-end pt-4">
                <button type="submit"
                    class="px-6 py-2.5 bg-orange-500 hover:bg-orange-600 active:bg-orange-700 text-white font-medium text-sm rounded-lg shadow-sm shadow-orange-500/20 transition-all cursor-pointer">
                    Post Question Entry
                </button>
            </div>

        </form>
    </div>
</div>
