<!-- Backdrop -->
<div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40 transition-opacity duration-300"
    [ngClass]="isOpen ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none'" (click)="closeDrawer()">
</div>

<!-- Drawer -->
<!-- <div class="fixed inset-y-0 right-0 z-50 w-full max-w-3xl bg-white shadow-2xl flex flex-col"></div> -->

<div class="fixed inset-y-0 right-0 z-50 w-full max-w-3xl bg-white shadow-2xl flex flex-col transform transition-transform duration-300 ease-in-out"
    [ngClass]="isOpen ? 'translate-x-0' : 'translate-x-full'">

    <!-- Header -->
    <div class="px-6 py-5 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
        <h3 class="text-lg font-bold text-slate-800">Edit Question Details</h3>
        <button type="button" (click)="closeDrawer()" class="p-2 text-slate-400 hover:text-slate-600">
            ✖
        </button>
    </div>

    <!-- Form -->
    <form [formGroup]="form" class="flex-1 overflow-y-auto p-6 space-y-6">

        <div>
            <h3 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-4">
                1. Metadata & Configuration
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-5">

                <!-- <div class="space-y-1 form-field">
                    <label>Serial Number</label>
                    <input type="text" formControlName="serialNumber" placeholder="ANG-01"
                        [ngClass]="{'border-red-500 focus:border-red-500 focus:ring-red-500/20': isInvalid('serialNumber'), 'border-gray-300 focus:border-indigo-500': !isInvalid('serialNumber')}">
                    @if (isInvalid('serialNumber')) {
                    <p class="text-xs text-red-500 mt-1">Serial number is required.</p>
                    }
                </div> -->
                

                <div class="space-y-1 form-field">
                    <label>Serial Number</label>
                    <input type="text" formControlName="serialNumber" placeholder="ANG-01" [ngClass]="{
                        'border-red-500 focus:border-red-500 focus:ring-red-500/20': isInvalid('serialNumber'),
                        'border-gray-300 focus:border-indigo-500': !isInvalid('serialNumber') }">
                    @if (isInvalid('serialNumber')) {
                    <p class="error-message">Serial number is required.</p>
                    }
                </div>

                <div class="space-y-1 form-field">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Language</label>
                    <select formControlName="languages"
                        class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-700 focus:outline-none focus:border-orange-500 focus:bg-white transition-colors">
                        @for(item of supportedLanguage; track $index){
                        <option [value]="item.name">{{ item.value }}</option>
                        }
                    </select>
                </div>

                <div class="space-y-1">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Label</label>
                    <input type="text" formControlName="label"
                        class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-700 focus:outline-none focus:border-orange-500 focus:bg-white transition-colors"
                        placeholder="Beginner">
                </div>

                <div class="space-y-1">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Topic</label>
                    <select formControlName="topic"
                        class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-700 focus:outline-none focus:border-orange-500 focus:bg-white transition-colors">
                        @for(item of topics; track $index){
                        <option [value]="item.name">{{ item.value }}</option>
                        }
                    </select>
                </div>

                <div class="space-y-1">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Content status</label>
                    <input type="text" formControlName="contentStatus"
                        class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-700 focus:outline-none focus:border-orange-500 focus:bg-white transition-colors"
                        placeholder="Beginner">
                </div>

                <div class="space-y-1 flex items-center pt-6">
                    <label class="relative flex items-center cursor-pointer select-none">
                        <input type="checkbox" formControlName="visible"
                            class="w-4 h-4 text-orange-600 border-slate-300 rounded focus:ring-orange-500">
                        <span class="ml-2 text-sm font-medium text-slate-700">Make field visible on site</span>
                    </label>
                </div>

            </div>
        </div>

        <!-- <hr class="border-slate-200"> -->

        <div class="space-y-5">
            <h3 class="text-sm font-semibold uppercase tracking-wider text-slate-400">2. Core Question & Answers
            </h3>

            <div class="space-y-1.5">
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide">Question</label>
                <input type="text" formControlName="question"
                    class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800 focus:outline-none focus:border-orange-500 focus:bg-white transition-colors" />
            </div>

            <div class="space-y-1.5">
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide">Answer</label>
                <textarea rows="3" formControlName="answer"
                    class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-700 focus:outline-none focus:border-orange-500 focus:bg-white transition-colors resize-none"></textarea>
            </div>

            <div class="space-y-1.5">
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide">Additional
                    Explanation</label>
                <textarea rows="3" formControlName="answer2"
                    class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-700 focus:outline-none focus:border-orange-500 focus:bg-white transition-colors"></textarea>
            </div>

        </div>

        <!-- <hr class="border-slate-200"> -->

        <!-- <div class="space-y-6">

            <button type="button" (click)="closeDrawer()" class="px-4 py-2.5">Cancel</button>

    </form>

    <!-- Footer -->
    <div class="px-6 py-4 border-t border-slate-100 bg-slate-50 flex items-center justify-end gap-3">
        <button type="button" (click)="closeDrawer()" class="px-4 py-2.5">Cancel</button>
        <button type="submit" (click)="onSubmit()" class="px-5 py-2.5 bg-orange-500 text-white rounded">Save
            Changes</button>
    </div>
</div>
