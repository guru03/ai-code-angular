<div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40 transition-opacity duration-300"
    [ngClass]="isOpen ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none'" (click)="closeDrawer()">
</div>


<div class="fixed inset-y-0 right-0 z-50 w-full max-w-2xl bg-white shadow-2xl flex flex-col transform transition-transform duration-300 ease-in-out"
    [ngClass]="isOpen ? 'translate-x-0' : 'translate-x-full'">

    <div class="px-6 py-5 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
        <div>
            <div class="flex items-center gap-2 mb-1">
                <span
                    class="px-2.5 py-0.5 text-xs font-semibold uppercase tracking-wider rounded-full bg-orange-100 text-orange-700">ANGULAR</span>
                <span class="text-xs text-slate-400">#01</span>
            </div>
            <h3 class="text-lg font-bold text-slate-800">Edit Question Details</h3>
        </div>

        <button type="button" (click)="closeDrawer()"
            class="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>

    </div>

    <form class="flex-1 overflow-y-auto p-6 space-y-6">

        <div class="space-y-1.5">
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide">Question Title</label>
            <input type="text" value="What are lifecycle hooks in Angular?"
                class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm font-medium text-slate-800 focus:outline-none focus:border-orange-500 focus:bg-white transition-colors" />
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="space-y-1.5">
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide">Difficulty</label>
                <select
                    class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-700 focus:outline-none focus:border-orange-500 focus:bg-white transition-colors">
                    <option selected>Beginner</option>
                    <option>Intermediate</option>
                    <option>Advanced</option>
                </select>
            </div>

            <div class="space-y-1.5">
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide">Read Time (mins)</label>
                <input type="number" value="5"
                    class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-700 focus:outline-none focus:border-orange-500 focus:bg-white transition-colors" />
            </div>

            <div class="space-y-1.5">
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide">Status</label>
                <select
                    class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-700 focus:outline-none focus:border-orange-500 focus:bg-white transition-colors">
                    <option>Draft</option>
                    <option selected>Completed</option>
                </select>
            </div>
        </div>

        <div class="space-y-1.5">
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide">Summary Intro</label>
            <textarea rows="3"
                class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-700 focus:outline-none focus:border-orange-500 focus:bg-white transition-colors resize-none">Every component in Angular has a lifecycle, and different phases it goes through from the time of creation to the time it's destroyed...</textarea>
        </div>

        <div class="space-y-3">
            <div class="flex items-center justify-between">
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide">Detailed Bullet Points
                    (Hooks)</label>
                <button type="button"
                    class="text-xs font-semibold text-orange-600 hover:text-orange-700 transition-colors">+ Add
                    Hook</button>
            </div>

            <div class="space-y-2 p-4 bg-slate-50 border border-slate-100 rounded-xl relative group">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                    <input type="text" value="ngOnChanges" placeholder="Hook Name"
                        class="md:col-span-1 px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm font-semibold text-orange-600 focus:outline-none focus:border-orange-500" />
                    <input type="text"
                        value="Called before ngOnInit and whenever one or more data bound input properties change."
                        placeholder="Description"
                        class="md:col-span-3 px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm text-slate-600 focus:outline-none focus:border-orange-500" />
                </div>
                <button type="button"
                    class="absolute -top-2 -right-2 hidden group-hover:flex items-center justify-center w-5 h-5 bg-red-100 hover:bg-red-200 text-red-600 rounded-full text-xs transition-colors shadow-sm">
                    &times;
                </button>
            </div>

            <div class="space-y-2 p-4 bg-slate-50 border border-slate-100 rounded-xl relative group">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                    <input type="text" value="ngOnInit"
                        class="md:col-span-1 px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm font-semibold text-orange-600 focus:outline-none focus:border-orange-500" />
                    <input type="text"
                        value="Called once, after the first ngOnChanges. This is where you can perform component initialization."
                        class="md:col-span-3 px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm text-slate-600 focus:outline-none focus:border-orange-500" />
                </div>
            </div>
        </div>

    </form>


    <div class="px-6 py-4 border-t border-slate-100 bg-slate-50 flex items-center justify-end gap-3">
        <button type="button" (click)="closeDrawer()"
            class="px-4 py-2.5 text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">
            Cancel
        </button>
        <button type="submit"
            class="px-5 py-2.5 text-sm font-semibold text-white bg-orange-500 hover:bg-orange-600 rounded-lg shadow-sm transition-colors">
            Save Changes
        </button>
    </div>


</div>
