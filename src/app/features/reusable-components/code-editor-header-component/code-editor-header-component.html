<div
    class="flex items-center justify-between text-slate-400 rounded-t-md px-4 py-1 bg-slate-900 border-b border-gray-700">
    <div class="flex items-center space-x-2">
        <span class="w-3 h-3 rounded-full bg-red-500"></span>
        <span class="w-3 h-3 rounded-full bg-yellow-500"></span>
        <span class="w-3 h-3 rounded-full bg-green-500"></span>
        <span class="ml-2 text-[11px] font-sans tracking-wide">solution.ts</span>
    </div>
    <div class="flex items-center gap-4">
        <span class="text-[11px] uppercase bg-slate-800 px-2 py-0.5 border border-slate-700 rounded">
            {{ codeLanguage }}
        </span>

        <button [cdkCopyToClipboard]="codeText" (cdkCopyToClipboardCopied)="onCopied($event)"
            class="relative text-[11px] bg-slate-800 px-2 py-0.5 rounded flex items-center gap-1 border border-slate-700 hover:border-orange-600">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>

            @if (!copied()) {
            <span>
                Copy
            </span>
            } @else {
            <span>
                Copied!
            </span>
            }

        </button>
    </div>
</div>
