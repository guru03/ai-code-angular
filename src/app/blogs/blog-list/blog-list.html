<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Top Actions / Header Row -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8">
        <div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Blog List Management</h1>
            <p class="text-sm text-gray-500 mt-1">Create, update, and manage your published articles.</p>
        </div>
        <a [routerLink]='["add-blog"]'
            class="inline-flex items-center justify-center bg-orange-500 hover:bg-orange-600 text-white text-sm font-semibold px-4 py-2.5 rounded-xl shadow-sm transition gap-2 self-start sm:self-auto">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
            </svg>
            Add New Blog
        </a>
    </div>

    <!-- Responsive Grid for Layout Structure -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- Left/Center Column: Blog List Table -->
        <div class="lg:col-span-2">
            <div class="bg-white border border-gray-200 rounded-2xl shadow-sm overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr
                                class="bg-gray-50 border-b border-gray-200 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                                <th class="py-4 px-6 w-16 text-center">ID</th>
                                <th class="py-4 px-6">Title</th>
                                <th class="py-4 px-6">Content</th>
                                <th class="py-4 px-6 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100 text-sm">

                            @for (blog of blogs$ | async; track $index) {
                            <tr class="hover:bg-gray-50/70 transition">
                                <td class="py-4 px-6 text-center font-semibold text-gray-400">{{ $index + 1 }}</td>
                                <td class="py-4 px-6 font-semibold text-slate-900">{{ blog.title }}</td>
                                <td class="py-4 px-6 text-gray-600 max-w-xs truncate">{{ blog.content }}</td>
                                <td class="py-4 px-6 text-right whitespace-nowrap">
                                    <a [routerLink]="['edit', blog.id]"
                                        class="text-indigo-600 hover:text-indigo-900 font-medium mr-3 transition">Edit</a>
                                    <a (click)="onDeleteBlog(blog.id)"
                                        class="text-red-600 hover:text-red-900 font-medium transition">Delete</a>
                                </td>
                            </tr>
                            }
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Right Column: Edit Blog Panel Form -->



        <div class="lg:col-span-1">
            <router-outlet></router-outlet>
            
        </div>
    </div>


</div>
