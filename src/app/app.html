<div class="min-h-screen bg-slate-50 font-sans text-slate-900">

  <!-- Navigation (Simplified for Demo) -->
  <nav class="sticky top-0 z-50 flex items-center justify-between border-b bg-white/80 px-8 py-4 backdrop-blur-md">
    <div class="flex items-center gap-2">
      <div class="h-10 w-10 bg-orange-500 rounded-lg flex items-center justify-center font-bold text-white text-xl">
        AI</div>
      <span class="text-xl font-black tracking-tight">WEB <span class="text-orange-500">HACK</span></span>
    </div>
    <div class="hidden md:flex items-center gap-8 font-medium text-slate-600">
      <a routerLinkActive="text-orange-600 border-b-2 border-orange-500" [routerLink]='["/home"]'
        class="hover:text-orange-500 transition-colors">Home</a>

      <a routerLinkActive="text-orange-600 border-b-2 border-orange-500" [routerLink]='["/about"]'
        class="hover:text-orange-500 transition-colors">About</a>

      <a routerLinkActive="text-orange-600 border-b-2 border-orange-500" [routerLink]='["/angular/questions"]'
        class="hover:text-orange-500 transition-colors">Angular</a>

      <a routerLinkActive="text-orange-600 border-b-2 border-orange-500" [routerLink]='["/blogs"]'
        class="hover:text-orange-500 transition-colors">blog-list</a>

      <a routerLinkActive="text-orange-600 border-b-2 border-orange-500" [routerLink]='["/signals"]'
        class="hover:text-orange-500 transition-colors">Signals</a>

      <a routerLinkActive="text-orange-600 border-b-2 border-orange-500" [routerLink]='["/design/design"]'
        class="hover:text-orange-500 transition-colors">Design</a>

      <div class="relative inline-block text-left group py-3">
        <button type="button"
          class="inline-flex items-center gap-1 text-slate-600 group-hover:text-slate-900 group-hover:bg-slate-50 rounded-md transition focus:outline-none">
          <span>Resources</span>
          <svg
            class="h-4 w-4 text-slate-400 group-hover:text-slate-600 transition-transform duration-200 group-hover:rotate-180"
            xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd"
              d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z"
              clip-rule="evenodd" />
          </svg>
        </button>

        <!-- Dropdown -->
        <div class="absolute left-0 mt-1 w-56 origin-top-left rounded-xl bg-white p-2 shadow-xl ring-1 ring-black ring-opacity-5 z-50
              hidden group-hover:block transition-all duration-150 ease-out">
          <div class="py-1">
            <a [routerLink]='["/design/interview"]'
              class="flex items-center px-3 py-2  text-slate-700 hover:bg-slate-50 hover:text-orange-600 rounded-lg transition">
              Interview
            </a>
            <a [routerLink]='["/design/interview-1"]'
              class="flex items-center px-3 py-2  text-slate-700 hover:bg-slate-50 hover:text-orange-600 rounded-lg transition">
              Interview-1
            </a>
            <a [routerLink]='["/design/blogs"]'
              class="flex items-center px-3 py-2 text-slate-700 hover:bg-slate-50 hover:text-orange-600 rounded-lg transition">
              Blogs
            </a>
            <div class="my-1 border-t border-slate-100"></div>
            <a href="#"
              class="flex items-center px-3 py-2 text-slate-50 font-medium bg-slate-950 hover:bg-slate-900 rounded-lg transition">
              New Designs
            </a>
          </div>
        </div>
      </div>

      <a routerLinkActive="text-orange-600 border-b-2 border-orange-500" [routerLink]='["/contact"]'
        class="hover:text-orange-500 transition-colors">Contact</a>
    </div>

    <div class="flex gap-4">
      <a routerLinkActive="active" [routerLink]='["/login"]'
        class="px-4 py-2 text-sm font-semibold text-slate-700">Login</a>
      <a routerLinkActive="active" [routerLink]='["/sign-up"]'
        class="rounded-full bg-slate-900 px-5 py-2 text-sm font-semibold text-white hover:bg-orange-600 transition-all">Sign
        Up</a>
    </div>
  </nav>

  <!--? This is where routed components will render -->
  <div class="min-h-screen bg-slate-50 text-slate-800 antialiased selection:bg-orange-500 selection:text-white">
    <router-outlet></router-outlet>
  </div>

  <footer class="bg-slate-100 text-center py-6 text-sm text-slate-500">
    &copy; 2026 AI WEB HACK. All rights reserved.
  </footer>

</div>
