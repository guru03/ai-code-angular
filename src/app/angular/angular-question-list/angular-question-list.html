<div class="middleContainer">
    <h3 class="mb-4 text-xl">NgRx Concepts</h3>
    @for (item of getQuestionList$ | async; track $index) {
    @if (item.visible === true && (activeCategory() === 'All' || item.category === activeCategory())) {
    <div class="question shadow-sm">
        <div class="flex">
            <div class="number">
                <h3 class="me-2 text-xl"><a class="p-0" routerLinkActive="active"
                        [routerLink]='["/angular/questions", item.id]'>{{ $index + 1 }}:</a></h3>
            </div>
            <div class="question-text">
                <h3 class="text-xl">
                    <span>{{ item.question }}</span>
                </h3>
                <p>{{ item.category }}</p>
                <div class="text-lg" [innerHTML]="setHtml(item.answer)"></div>
                @if (item.answer2) {
                <div class="mt-3"><span class="text-lg font-medium">Additional Explanation:</span></div>
                <div class="text-lg" [innerHTML]="setHtml(item.answer2)"></div>
                }
            </div>
        </div>
    </div>
    } }
</div>
